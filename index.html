
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   

    <title>Simon Says Game</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="info" style="font-size: 20px";"><i class="fa fa-info-circle"></i></button>
        <div id="info-message" class="hidden">
    <h3>How to Play</h3>
    <p>1. Click Start to begin.</p>
    <p>2. Remember the color sequence.</p>
    <p>3. Tap the colors in the same order.</p>
    <p>4. Each correct round increases your level.</p>
    <button id="close-info">Close</button>
</div>
        <h1>Simon Says Game</h1>
        <h2>Press the button to start</h2>
        
        <div class="btns">
            <div class="btn red"></div>
            <div class="btn yellow"></div>

            <button class="start">Start</button>

            <div class="btn green"></div>
            <div class="btn blue"></div>
        </div>
    </div>

    <div class="score-container">
        <div class="last">
        <h3>Score: <span id="score">0</span></h3>
        <h3>High Score: <span id="high-score">0</span></h3>
        </div>
        <button class="reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
